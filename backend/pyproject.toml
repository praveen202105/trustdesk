[project]
name = "trustdesk"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "alembic", "pgvector", "pydantic-settings", "httpx", "itsdangerous", "numpy"]
[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-requests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
