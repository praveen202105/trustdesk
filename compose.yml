services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: trustdesk
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: trustdesk
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["trustdesk-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://trustdesk:local-dev-only@db/trustdesk
      MOCK_ACTION_BASE_URL: http://mock-actions:8001
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
  mock-actions:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: uvicorn trustdesk.mock_actions:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+psycopg://trustdesk:local-dev-only@db/trustdesk
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m trustdesk.worker
    environment:
      DATABASE_URL: postgresql+psycopg://trustdesk:local-dev-only@db/trustdesk
      MOCK_ACTION_BASE_URL: http://mock-actions:8001
    depends_on:
      db: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
volumes:
  trustdesk-db:
